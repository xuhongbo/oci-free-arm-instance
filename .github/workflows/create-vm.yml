name: Try to Create OCI VM

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: oci-free-arm-instance
  cancel-in-progress: false

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        run: |
          set -euo pipefail
          export SUPPRESS_LABEL_WARNING=True
          export PIP_DISABLE_PIP_VERSION_CHECK=1

          if command -v oci >/dev/null 2>&1; then
            echo "Using cached OCI CLI: $(oci --version)"
          else
            python -m pip install --user oci-cli
            echo "Installed OCI CLI: $(oci --version)"
          fi

          mkdir -p ~/.oci
          printf '%s\n' "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_CLI_USER }}"
            echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}"
            echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}"
            echo "key_file=~/.oci/oci_api_key.pem"
            echo "region=${OCI_CLI_REGION:-us-phoenix-1}"
          } > ~/.oci/config

          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          AD_NAME="${{ secrets.AD_NAME }}"
          if [ -z "$AD_NAME" ]; then
            AD_NAMES=("MiSL:PHX-AD-3")
          else
            AD_NAMES=("$AD_NAME")
          fi

          IMAGE_ID="${{ secrets.IMAGE_ID }}"
          if [ -z "$IMAGE_ID" ]; then
            IMAGE_ID=$(oci compute image list \
              --compartment-id "$COMPARTMENT_ID" \
              --shape "VM.Standard.A1.Flex" \
              --operating-system "Canonical Ubuntu" \
              --operating-system-version "24.04" \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --query 'data[0].id' \
              --raw-output)
          fi

          if [ "${#AD_NAMES[@]}" -eq 0 ] || [ -z "$IMAGE_ID" ]; then
            echo "Could not resolve AD_NAME(s) or IMAGE_ID."
            exit 1
          fi

          EXISTING_A1=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --all \
            --output json | python -c 'import json, sys; items=json.load(sys.stdin)["data"]; matches=[item for item in items if item.get("shape")=="VM.Standard.A1.Flex" and item.get("lifecycle-state")!="TERMINATED"]; print("{} {} {}".format(matches[0].get("display-name"), matches[0].get("lifecycle-state"), matches[0].get("id"))) if matches else None')

          if [ -n "$EXISTING_A1" ]; then
            echo "Existing A1 instance found: $EXISTING_A1"
            {
              echo "log_data<<EOF"
              echo "Existing A1 instance found: $EXISTING_A1"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OCI_OUTPUT=""
          for AD in "${AD_NAMES[@]}"; do
            echo "Trying availability domain: $AD"
            for LAUNCH_ATTEMPT in 1 2 3; do
              echo "Launch attempt $LAUNCH_ATTEMPT for $AD"
              ATTEMPT_OUTPUT=$(timeout 300s oci compute instance launch \
                --compartment-id "$COMPARTMENT_ID" \
                --availability-domain "$AD" \
                --shape "VM.Standard.A1.Flex" \
                --shape-config '{"ocpus":2,"memoryInGBs":12}' \
                --subnet-id "$SUBNET_ID" \
                --image-id "$IMAGE_ID" \
                --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
                --assign-public-ip true \
                --display-name "plane-vm" \
                --boot-volume-size-in-gbs 100 2>&1 || true)

              OCI_OUTPUT="${OCI_OUTPUT}"$'\n'"===== $AD attempt $LAUNCH_ATTEMPT ====="$'\n'"${ATTEMPT_OUTPUT}"

              echo "OCI launch output for $AD attempt $LAUNCH_ATTEMPT:"
              echo "$ATTEMPT_OUTPUT"

              if echo "$ATTEMPT_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
                {
                  echo "log_data<<EOF"
                  echo "$OCI_OUTPUT"
                  echo "EOF"
                } >> "$GITHUB_OUTPUT"
                echo "Success! 'PROVISIONING' state found in output."
                exit 0
              fi

              if echo "$ATTEMPT_OUTPUT" | grep -Eiq 'RequestException|timed out|timeout|connection reset|temporarily unavailable'; then
                echo "Transient OCI/network error detected; retrying this AD after 30 seconds."
                sleep 30
                continue
              fi

              break
            done
          done

          {
            echo "log_data<<EOF"
            echo "$OCI_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Error: Success string not found in OCI output. Failing the step."
          exit 1

      - name: Create success issue
        if: steps.create_vm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/oci-success-issue.md <<EOF
          @xuhongbo OCI A1.Flex instance created successfully.

          Shape: VM.Standard.A1.Flex
          Resources: 2 OCPU, 12 GB memory, 100 GB boot volume
          Region: ${OCI_CLI_REGION:-us-phoenix-1}

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          gh issue create \
            --title "OCI VM created successfully" \
            --body-file /tmp/oci-success-issue.md \
            --assignee xuhongbo

      - name: Disable workflow after success
        if: steps.create_vm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/create-vm.yml/disable"

      - name: Queue next retry
        if: failure() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 300
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/create-vm.yml/dispatches" \
            -d '{"ref":"main"}'
