name: Try to Create OCI VM

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: oci-free-arm-instance
  cancel-in-progress: false

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  PARALLEL_AD_JITTER_SECONDS: 6
  RETRY_DELAY_SECONDS: 60

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Restore OCI CLI cache
        id: oci_cli_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local
            ~/.cache/pip
          key: ${{ runner.os }}-pip-oci-cli-v2
          restore-keys: |
            ${{ runner.os }}-pip-oci-cli-

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        run: |
          set -euo pipefail
          export SUPPRESS_LABEL_WARNING=True
          export PIP_DISABLE_PIP_VERSION_CHECK=1

          if command -v oci >/dev/null 2>&1; then
            echo "Using cached OCI CLI: $(oci --version)"
          else
            python -m pip install --user oci-cli
            echo "Installed OCI CLI: $(oci --version)"
          fi

          mkdir -p ~/.oci
          printf '%s\n' "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_CLI_USER }}"
            echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}"
            echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}"
            echo "key_file=~/.oci/oci_api_key.pem"
            echo "region=${OCI_CLI_REGION:-us-phoenix-1}"
          } > ~/.oci/config

          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          AD_NAMES_SECRET="${{ secrets.AD_NAMES }}"
          if [ -z "$AD_NAMES_SECRET" ]; then
            AD_NAMES=("MiSL:PHX-AD-3" "MiSL:PHX-AD-1" "MiSL:PHX-AD-2")
          else
            IFS=',' read -r -a AD_NAMES <<< "$AD_NAMES_SECRET"
          fi
          echo "Availability domains to try: ${AD_NAMES[*]}"

          SHAPE_CONFIGS_SECRET="${{ secrets.SHAPE_CONFIGS }}"
          if [ -z "$SHAPE_CONFIGS_SECRET" ]; then
            SHAPE_CONFIGS=("1:6" "2:12" "4:24")
          else
            IFS=',' read -r -a SHAPE_CONFIGS <<< "$SHAPE_CONFIGS_SECRET"
          fi
          echo "Shape configs to try: ${SHAPE_CONFIGS[*]}"

          IMAGE_ID="${{ secrets.IMAGE_ID }}"
          if [ -z "$IMAGE_ID" ]; then
            IMAGE_ID=$(oci compute image list \
              --compartment-id "$COMPARTMENT_ID" \
              --shape "VM.Standard.A1.Flex" \
              --operating-system "Canonical Ubuntu" \
              --operating-system-version "24.04" \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --query 'data[0].id' \
              --raw-output)
          fi

          if [ "${#AD_NAMES[@]}" -eq 0 ] || [ "${#SHAPE_CONFIGS[@]}" -eq 0 ] || [ -z "$IMAGE_ID" ]; then
            echo "Could not resolve AD_NAME(s), SHAPE_CONFIGS, or IMAGE_ID."
            exit 1
          fi

          EXISTING_A1=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --all \
            --output json | python -c 'import json, sys; items=json.load(sys.stdin)["data"]; matches=[item for item in items if item.get("shape")=="VM.Standard.A1.Flex" and item.get("lifecycle-state")!="TERMINATED"]; print("{} {} {}".format(matches[0].get("display-name"), matches[0].get("lifecycle-state"), matches[0].get("id"))) if matches else None')

          if [ -n "$EXISTING_A1" ]; then
            echo "Existing A1 instance found: $EXISTING_A1"
            {
              echo "log_data<<EOF"
              echo "Existing A1 instance found: $EXISTING_A1"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OCI_OUTPUT=""
          RUN_DIR=$(mktemp -d)
          trap 'rm -rf "$RUN_DIR"' EXIT

          launch_candidate() {
            local shape_config="$1"
            local ad="$2"
            local output_file="$3"
            local result_file="$4"
            local ocpus memory_gbs delay launch_attempt attempt_output instance_id
            IFS=':' read -r ocpus memory_gbs <<< "$shape_config"

            {
              delay=$((RANDOM % (PARALLEL_AD_JITTER_SECONDS + 1)))
              if [ "$delay" -gt 0 ]; then
                echo "Staggering launch by ${delay} seconds to avoid request bursts."
                sleep "$delay"
              fi

              echo "Trying availability domain: $ad"
              for launch_attempt in 1 2 3; do
                echo "Launch attempt $launch_attempt for $ad with ${ocpus} OCPU / ${memory_gbs} GB"
                attempt_output=$(timeout 300s oci compute instance launch \
                  --compartment-id "$COMPARTMENT_ID" \
                  --availability-domain "$ad" \
                  --shape "VM.Standard.A1.Flex" \
                  --shape-config "{\"ocpus\":${ocpus},\"memoryInGBs\":${memory_gbs}}" \
                  --subnet-id "$SUBNET_ID" \
                  --image-id "$IMAGE_ID" \
                  --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
                  --assign-public-ip true \
                  --display-name "plane-vm" \
                  --boot-volume-size-in-gbs 100 2>&1 || true)

                echo "OCI launch output for $ad with ${ocpus} OCPU / ${memory_gbs} GB attempt $launch_attempt:"
                echo "$attempt_output"

                if echo "$attempt_output" | grep -q '"lifecycle-state": "PROVISIONING"'; then
                  instance_id=$(printf '%s\n' "$attempt_output" | python -c 'import json, sys; print(json.load(sys.stdin).get("data", {}).get("id", ""))' 2>/dev/null || true)
                  {
                    echo "status=success"
                    echo "ocpus=$ocpus"
                    echo "memory_gbs=$memory_gbs"
                    echo "availability_domain=$ad"
                    echo "instance_id=$instance_id"
                  } > "$result_file"
                  echo "Success! 'PROVISIONING' state found in output."
                  exit 0
                fi

                if echo "$attempt_output" | grep -Eiq 'RequestException|timed out|timeout|connection reset|temporarily unavailable'; then
                  echo "Transient OCI/network error detected; retrying this AD and shape after 30 seconds."
                  sleep 30
                  continue
                fi

                break
              done

              echo "status=failure" > "$result_file"
              exit 1
            } > "$output_file" 2>&1
          }

          for SHAPE_CONFIG in "${SHAPE_CONFIGS[@]}"; do
            IFS=':' read -r OCPUS MEMORY_GBS <<< "$SHAPE_CONFIG"
            if [ -z "$OCPUS" ] || [ -z "$MEMORY_GBS" ]; then
              echo "Invalid shape config: $SHAPE_CONFIG. Expected format OCPUS:MEMORY_GBS."
              exit 1
            fi

            echo "Trying shape config: ${OCPUS} OCPU / ${MEMORY_GBS} GB across ${#AD_NAMES[@]} availability domains in parallel"
            PIDS=()
            OUTPUT_FILES=()
            RESULT_FILES=()
            for AD in "${AD_NAMES[@]}"; do
              SAFE_AD=$(printf '%s' "$AD" | tr -c '[:alnum:]_.-' '_')
              OUTPUT_FILE="$RUN_DIR/${OCPUS}C_${MEMORY_GBS}G_${SAFE_AD}.log"
              RESULT_FILE="$RUN_DIR/${OCPUS}C_${MEMORY_GBS}G_${SAFE_AD}.result"
              launch_candidate "$SHAPE_CONFIG" "$AD" "$OUTPUT_FILE" "$RESULT_FILE" &
              PIDS+=("$!")
              OUTPUT_FILES+=("$OUTPUT_FILE")
              RESULT_FILES+=("$RESULT_FILE")
            done

            for PID in "${PIDS[@]}"; do
              wait "$PID" || true
            done

            SHAPE_SUCCESS=0
            SUCCESS_OCPUS=""
            SUCCESS_MEMORY_GBS=""
            SUCCESS_AD=""
            SUCCESS_INSTANCE_ID=""

            for INDEX in "${!OUTPUT_FILES[@]}"; do
              AD="${AD_NAMES[$INDEX]}"
              CANDIDATE_LOG=$(cat "${OUTPUT_FILES[$INDEX]}" 2>/dev/null || true)
              OCI_OUTPUT="${OCI_OUTPUT}"$'\n'"===== ${OCPUS}C-${MEMORY_GBS}G $AD ====="$'\n'"${CANDIDATE_LOG}"
              echo "===== ${OCPUS}C-${MEMORY_GBS}G $AD ====="
              echo "$CANDIDATE_LOG"

              if [ "$SHAPE_SUCCESS" -eq 0 ] && [ -f "${RESULT_FILES[$INDEX]}" ] && grep -q '^status=success$' "${RESULT_FILES[$INDEX]}"; then
                SHAPE_SUCCESS=1
                SUCCESS_OCPUS=$(awk -F= '/^ocpus=/{print $2}' "${RESULT_FILES[$INDEX]}")
                SUCCESS_MEMORY_GBS=$(awk -F= '/^memory_gbs=/{print $2}' "${RESULT_FILES[$INDEX]}")
                SUCCESS_AD=$(awk -F= '/^availability_domain=/{print $2}' "${RESULT_FILES[$INDEX]}")
                SUCCESS_INSTANCE_ID=$(awk -F= '/^instance_id=/{print $2}' "${RESULT_FILES[$INDEX]}")
              fi
            done

            if [ "$SHAPE_SUCCESS" -eq 1 ]; then
              {
                echo "log_data<<EOF"
                echo "$OCI_OUTPUT"
                echo "EOF"
                echo "ocpus=$SUCCESS_OCPUS"
                echo "memory_gbs=$SUCCESS_MEMORY_GBS"
                echo "availability_domain=$SUCCESS_AD"
                echo "instance_id=$SUCCESS_INSTANCE_ID"
              } >> "$GITHUB_OUTPUT"
              echo "Success! Instance ${SUCCESS_INSTANCE_ID:-unknown} is PROVISIONING."
              exit 0
            fi
          done

          {
            echo "log_data<<EOF"
            echo "$OCI_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Error: Success string not found in OCI output. Failing the step."
          exit 1

      - name: Save OCI CLI cache
        if: always() && steps.oci_cli_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ~/.local
            ~/.cache/pip
          key: ${{ steps.oci_cli_cache.outputs.cache-primary-key }}

      - name: Create success issue
        if: steps.create_vm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/oci-success-issue.md <<EOF
          @xuhongbo OCI A1.Flex instance created successfully.

          Shape: VM.Standard.A1.Flex
          Resources: ${{ steps.create_vm.outputs.ocpus }} OCPU, ${{ steps.create_vm.outputs.memory_gbs }} GB memory, 100 GB boot volume
          Availability domain: ${{ steps.create_vm.outputs.availability_domain }}
          Next step: verify the instance, then keep this size or resize it after migration.
          Region: ${OCI_CLI_REGION:-us-phoenix-1}

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          gh issue create \
            --title "OCI VM created successfully" \
            --body-file /tmp/oci-success-issue.md \
            --assignee xuhongbo

      - name: Disable workflow after success
        if: steps.create_vm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/create-vm.yml/disable"

      - name: Queue next retry
        if: failure() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Queueing next retry after ${RETRY_DELAY_SECONDS} seconds."
          sleep "${RETRY_DELAY_SECONDS}"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/create-vm.yml/dispatches" \
            -d '{"ref":"main"}'
