name: Try to Create OCI VM

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: oci-free-arm-instance
  cancel-in-progress: false

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        run: |
          set -euo pipefail
          export SUPPRESS_LABEL_WARNING=True

          python -m pip install --user oci-cli

          mkdir -p ~/.oci
          printf '%s\n' "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_CLI_USER }}"
            echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}"
            echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}"
            echo "key_file=~/.oci/oci_api_key.pem"
            echo "region=${OCI_CLI_REGION:-us-phoenix-1}"
          } > ~/.oci/config

          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          AD_NAME="${{ secrets.AD_NAME }}"
          if [ -z "$AD_NAME" ]; then
            mapfile -t AD_NAMES < <(oci iam availability-domain list \
              --compartment-id "$COMPARTMENT_ID" \
              --output json | python -c 'import json, sys; print("\n".join(ad["name"] for ad in json.load(sys.stdin)["data"]))')
          else
            AD_NAMES=("$AD_NAME")
          fi

          IMAGE_ID="${{ secrets.IMAGE_ID }}"
          if [ -z "$IMAGE_ID" ]; then
            IMAGE_ID=$(oci compute image list \
              --compartment-id "$COMPARTMENT_ID" \
              --shape "VM.Standard.A1.Flex" \
              --operating-system "Canonical Ubuntu" \
              --operating-system-version "24.04" \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --query 'data[0].id' \
              --raw-output)
          fi

          if [ "${#AD_NAMES[@]}" -eq 0 ] || [ -z "$IMAGE_ID" ]; then
            echo "Could not resolve AD_NAME(s) or IMAGE_ID."
            exit 1
          fi

          OCI_OUTPUT=""
          for AD in "${AD_NAMES[@]}"; do
            echo "Trying availability domain: $AD"
            ATTEMPT_OUTPUT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "coolify-vm" \
              --boot-volume-size-in-gbs 200 2>&1 || true)

            OCI_OUTPUT="${OCI_OUTPUT}"$'\n'"===== $AD ====="$'\n'"${ATTEMPT_OUTPUT}"

            echo "OCI launch output for $AD:"
            echo "$ATTEMPT_OUTPUT"

            if echo "$ATTEMPT_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              {
                echo "log_data<<EOF"
                echo "$OCI_OUTPUT"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              echo "Success! 'PROVISIONING' state found in output."
              exit 0
            fi
          done

          {
            echo "log_data<<EOF"
            echo "$OCI_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Error: Success string not found in OCI output. Failing the step."
          exit 1

      - name: Create success issue
        if: steps.create_vm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/oci-success-issue.md <<EOF
          @xuhongbo OCI A1.Flex instance created successfully.

          Shape: VM.Standard.A1.Flex
          Resources: 4 OCPU, 24 GB memory, 200 GB boot volume
          Region: ${OCI_CLI_REGION:-us-phoenix-1}

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          gh issue create \
            --title "OCI VM created successfully" \
            --body-file /tmp/oci-success-issue.md \
            --assignee xuhongbo

      - name: Disable workflow after success
        if: steps.create_vm.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/create-vm.yml/disable"

      - name: Queue next retry
        if: failure() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 300
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/create-vm.yml/dispatches" \
            -d '{"ref":"main"}'
